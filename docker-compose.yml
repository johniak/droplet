services:
  web:
    image: johniak/droplet-backend:${DROPLET_IMAGE_TAG:-latest}
    build: ./backend
    command: ["web"]
    restart: unless-stopped
    ports: ["8000:8000"]
    environment: &env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DROPLET_ADMIN_USER: ${DROPLET_ADMIN_USER:?set me}
      DROPLET_ADMIN_PASSWORD: ${DROPLET_ADMIN_PASSWORD:?set me}
      DROPLET_AUTO_COVERS: ${DROPLET_AUTO_COVERS:-1}
    volumes:
      - droplet-data:/data
      - ${LIBRARY_PATH:?set me}:/library:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    image: johniak/droplet-backend:${DROPLET_IMAGE_TAG:-latest}
    build: ./backend
    command: ["worker"]
    restart: unless-stopped
    environment: *env
    volumes:
      - droplet-data:/data
      - ${LIBRARY_PATH:?set me}:/library:ro
    depends_on:
      web:
        condition: service_healthy
volumes:
  droplet-data:
